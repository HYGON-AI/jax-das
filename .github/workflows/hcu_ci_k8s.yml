#
# Organization variables consumed below:
#   BASE_COMPILE_IMAGE_ROCKY_PY311  base compile image, "<registry>/<repo>:<tag>"
#   RESOURCE_SERVER_URL             server resources url
#
# Repository variables consumed below (all optional):
#   HCU_PYTHON_BIN                  optional, default python3.11.
#   HCU_XLA_DAS_REPO                optional, default HYGON-AI/xla-das
#   HCU_XLA_DAS_REF                 optional, full 40-character commit SHA only;
#                                   defaults to the pinned xla-das main snapshot below.
#   HCU_DTK_VERSION                 optional, default 26.04. The tarball URL is derived from it.
#   HCU_PIP_INDEX_URL               optional, default the TUNA PyPI mirror

name: CI HCU (K8s)

permissions:
  contents: read

on:
  pull_request_target:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "jax/**"
      - "jaxlib/**"
      - "jax_plugins/**"
      - "tests/**"
      - "build/**"
      - "scripts/**"
      - "third_party/**"
      - "MODULE.bazel"
      - "WORKSPACE"
      - ".bazelrc"
      - ".github/workflows/hcu_ci_k8s.yml"
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  manual_approval:
    name: Manual Approval for CI
    runs-on: ubuntu-latest
    environment: ci-protection
    if: ${{ github.event_name == 'pull_request_target' }}
    steps:
      - run: echo "Waiting for approval..."

  build:
    name: Build JAX wheels
    runs-on: hygon-build
    needs: [manual_approval]
    if: ${{ always() && (needs.manual_approval.result == 'success' || needs.manual_approval.result == 'skipped') }}
    timeout-minutes: 120
    container:
      image: ${{ vars.BASE_COMPILE_IMAGE_ROCKY_PY311 }}
    env:
      DTK_VERSION: ${{ vars.HCU_DTK_VERSION || '26.04' }}
      RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}
      PYTHON_BIN: ${{ vars.HCU_PYTHON_BIN || 'python3.11' }}
      XLA_COMMIT: ${{ vars.HCU_XLA_DAS_REF || '8e709b7753a3a135e80c7b1b2fdba601a06dd168' }}
      RUN_NAME: ci-${{ github.run_id }}
    steps:
      - name: Checking out jax-das
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          path: jax-das
          persist-credentials: false

      - name: Validate pinned XLA commit
        working-directory: jax-das
        run: |
          if [[ ! "${XLA_COMMIT}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::HCU_XLA_DAS_REF must be a full 40-character commit SHA."
            exit 1
          fi
          echo "Pinned XLA commit: ${XLA_COMMIT}"

      - name: Checking out xla-das
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ vars.HCU_XLA_DAS_REPO || 'HYGON-AI/xla-das' }}
          ref: ${{ env.XLA_COMMIT }}
          path: xla-das
          persist-credentials: false

      - name: Install DTK, HCU LLVM, bazelisk and node
        working-directory: jax-das
        run: bash ci/setup_hcu_ci_env.sh

      - name: Configure pip index
        env:
          PIP_INDEX_URL: ${{ vars.HCU_PIP_INDEX_URL || 'https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple' }}
        run: |
          printf '[global]\nindex-url = %s\ntrusted-host = %s\ntimeout = 120\n' \
            "${PIP_INDEX_URL}" "$(awk -F/ '{print $3}' <<<"${PIP_INDEX_URL}")" \
            | tee /etc/pip.conf

      - name: Install Python build dependencies
        run: |
          "${PYTHON_BIN}" -m pip install "wheel>=0.40" auditwheel patchelf

      - name: Build JAX wheels
        working-directory: jax-das
        env:
          XLA_DIR: ${{ github.workspace }}/xla-das
          PYTHON_BIN: ${{ env.PYTHON_BIN }}
        run: |
          bash scripts/build_jax_dtk.sh

          # build_jax_dtk.sh may leave wheels for multiple jax versions under dist/.
          # Keep only the latest version per package so pip install does not fail.
          shopt -s nullglob
          ws=(dist/*.whl dist/linux/*.whl)
          shopt -u nullglob

          declare -A top
          for w in "${ws[@]}"; do
            b=${w##*/}; p=${b%%-*}; v=$(cut -d- -f2 <<<"$b")
            [[ -z "${top[$p]:-}" || "$v" == "$(printf '%s\n%s\n' "${top[$p]}" "$v" | sort -V | tail -1)" ]] && top[$p]=$v
          done
          for w in "${ws[@]}"; do
            b=${w##*/}; p=${b%%-*}; v=$(cut -d- -f2 <<<"$b")
            [[ "$v" != "${top[$p]}" ]] && rm -f "$w"
          done

          ls -l dist/

      - name: Upload wheels to shared storage
        run: |
          d="/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}"
          mkdir -p "${d}"
          cp jax-das/dist/*.whl "${d}/"
          ls -l "${d}/"

  # Decides the test pool, GPU set and test scope from the target branch, so
  # the single `test` job below can use a dynamic runs-on instead of two
  # near-duplicate fast/full jobs. runs-on supports `needs.*.outputs` here.
  plan:
    name: Select test pool
    runs-on: hygon-cpu
    outputs:
      pool: ${{ steps.plan.outputs.pool }}
      gpu_ids: ${{ steps.plan.outputs.gpu_ids }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - id: plan
        run: |
          if [[ "${{ github.event_name }}" == "pull_request_target" ]]; then
            target_branch="${{ github.base_ref }}"
          else
            target_branch="${{ github.ref_name }}"
          fi
          echo "Target branch: ${target_branch}"

          if [[ "${target_branch}" == "dev" ]]; then
            echo "Dev branch: fast suite on the 4-card pool"
            echo "pool=hygon-bw1100-4card" >>"${GITHUB_OUTPUT}"
            echo "gpu_ids=0,1,2,3" >>"${GITHUB_OUTPUT}"
            echo "mode=fast" >>"${GITHUB_OUTPUT}"
          else
            echo "Non-dev branch (${target_branch}): full suite on the 8-card pool"
            echo "pool=hygon-bw1100-8card" >>"${GITHUB_OUTPUT}"
            echo "gpu_ids=0,1,2,3,4,5,6,7" >>"${GITHUB_OUTPUT}"
            echo "mode=full" >>"${GITHUB_OUTPUT}"
          fi

  test:
    name: Test JAX on HCU
    needs: [build, plan]
    runs-on: ${{ needs.plan.outputs.pool }}
    timeout-minutes: 600
    container:
      image: ${{ vars.BASE_COMPILE_IMAGE_ROCKY_PY311 }}
    env:
      DTK_VERSION: ${{ vars.HCU_DTK_VERSION || '26.04' }}
      RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}
      PYTHON_BIN: ${{ vars.HCU_PYTHON_BIN || 'python3.11' }}
      RUN_NAME: ci-${{ github.run_id }}
      GPU_IDS: ${{ needs.plan.outputs.gpu_ids }}
    steps:
      - name: Checking out jax-das
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          path: jax-das
          persist-credentials: false

      - name: Install DTK, HCU LLVM, bazelisk and node
        working-directory: jax-das
        run: bash ci/setup_hcu_ci_env.sh

      - name: Device info
        run: |
          lscpu
          "${PYTHON_BIN}" -V
          source /opt/dtk/env.sh
          "${ROCM_PATH:-/opt/dtk}/bin/rocminfo"

      - name: Configure pip index
        env:
          PIP_INDEX_URL: ${{ vars.HCU_PIP_INDEX_URL || 'https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple' }}
        run: |
          printf '[global]\nindex-url = %s\ntrusted-host = %s\ntimeout = 120\n' \
            "${PIP_INDEX_URL}" "$(awk -F/ '{print $3}' <<<"${PIP_INDEX_URL}")" \
            | tee /etc/pip.conf

      - name: Download wheels from shared storage
        run: |
          d="/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}"
          mkdir -p jax-das/dist
          cp "${d}"/*.whl jax-das/dist/
          ls -l jax-das/dist/

      - name: Install JAX wheels and test dependencies
        working-directory: jax-das
        run: |
          "${PYTHON_BIN}" -m pip install absl-py hypothesis flatbuffers ./dist/jax*.whl
          "${PYTHON_BIN}" -m pip install --no-cache-dir -r build/test-requirements.txt
          source /opt/dtk/env.sh
          "${PYTHON_BIN}" -c 'import jax, jaxlib; print(jax.__version__, jaxlib.__version__)'

      - name: Test JAX
        timeout-minutes: 540
        working-directory: jax-das
        run: |
          source /opt/dtk/env.sh
          echo "Mode: ${{ needs.plan.outputs.mode }}, GPU_IDS: ${GPU_IDS}"

          if [[ "${{ needs.plan.outputs.mode }}" == "fast" ]]; then
            TEST_FILES=(
              tests/api_test.py
              tests/core_test.py
              tests/jax_jit_test.py
              tests/pmap_test.py
              tests/pjit_test.py
            )
            TEST_FILES+=(tests/lax_*_test.py)
            TEST_FILES+=(tests/pallas)
            GPU_IDS="${GPU_IDS}" bash scripts/run_full_dtk_csv_tests_parallel.sh "${TEST_FILES[@]}"
          else
            GPU_IDS="${GPU_IDS}" bash scripts/run_full_dtk_csv_tests_parallel.sh
          fi

      - name: Check test results
        working-directory: jax-das
        run: |
          summary="test_logs/${RUN_NAME}/summary.tsv"
          if [[ ! -f "${summary}" ]]; then
            echo "::error::Test summary not found: ${summary}"
            exit 1
          fi
          total="$(( $(wc -l < "${summary}") - 1 ))"
          if (( total == 0 )); then
            echo "::error::No test files were executed."
            exit 1
          fi
          failed="$(awk -F'\t' 'NR > 1 && $1 != "PASS"' "${summary}")"
          if [[ -n "${failed}" ]]; then
            echo "::error::$(printf '%s\n' "${failed}" | wc -l) test file(s) did not pass:"
            printf '%s\n' "${failed}"
            exit 1
          fi
          echo "All ${total} test files passed."

      - name: Upload JAX test artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jax-hcu-test-artifacts-${{ github.run_id }}
          path: jax-das/test_logs/${{ env.RUN_NAME }}/
          retention-days: 7
